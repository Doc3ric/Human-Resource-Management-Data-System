<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Error - HDMS- Human Resource Data Management System</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F9FAFB;
            --text-main: #111827;
            --text-muted: #6B7280;
            --card-bg: #FFFFFF;
            --border-color: #E5E7EB;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 4px 6px rgba(0, 0, 0, 0.02);
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            background-color: #FEE2E2;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px auto;
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            color: #EF4444;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }

        .form-group {
            text-align: left;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
            background-color: #F9FAFB;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background-color: #FFFFFF;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .help-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        <h1>Connection Failed</h1>
        <p>We couldn't connect to the Host Server. Please ensure the server is running and the IP address below is
            correct.</p>

        <form id="configForm">
            <div class="form-group">
                <label for="serverUrl">Host Server URL / IP Address</label>
                <input type="text" id="serverUrl" placeholder="http://10.40.0.103:8000" required>
                <div class="help-text">Example: http://10.40.0.103:8000</div>
            </div>

            <button type="submit">Save & Reconnect</button>
        </form>

        <div style="margin-top: 25px; border-top: 1px solid #e2e8f0; padding-top: 20px; text-align: center;">
            <p style="font-size: 13px; color: #64748b; margin-bottom: 12px; font-weight: normal;">Having persistent
                issues?</p>
            <button id="clearCacheBtn" type="button"
                style="background-color: #f8fafc; color: #64748b; border: 1px solid #cbd5e1; font-weight: 500; font-size: 13px; padding: 8px 16px;">Clear
                Application Cache</button>
        </div>
    </div>

    <script>
        // Request the current URL from the main process when loaded
        window.api.requestCurrentUrl().then((url) => {
            if (url) {
                document.getElementById('serverUrl').value = url;
            }
        });

        document.getElementById('configForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newUrl = document.getElementById('serverUrl').value.trim();
            if (newUrl) {
                // Ensure it starts with http:// or https://
                let formattedUrl = newUrl;
                if (!/^https?:\/\//i.test(formattedUrl)) {
                    formattedUrl = 'http://' + formattedUrl;
                }

                // Send to main process
                window.api.saveConfig(formattedUrl);
            }
        });

        document.getElementById('clearCacheBtn').addEventListener('click', () => {
            const btn = document.getElementById('clearCacheBtn');
            btn.textContent = 'Clearing Cache & Restarting...';
            btn.disabled = true;
            window.api.clearCache();
        });
    </script>
</body>

</html>
