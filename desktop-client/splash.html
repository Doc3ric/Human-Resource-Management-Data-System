<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading HDMS- Human Resource Data Management System...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            border-radius: 12px; /* Smooth corners for frameless window */
        }

        /* Ambient Background Animations */
        .background-blobs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            border-radius: 12px;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.3;
            border-radius: 50%;
            animation: float 8s infinite ease-in-out alternate;
        }

        .blob-1 {
            width: 350px;
            height: 350px;
            background: var(--primary);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: #8b5cf6;
            bottom: -80px;
            right: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 40px) scale(1.1); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3.5rem 4.5rem;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo Icon */
        .logo-wrapper {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px -5px var(--primary-glow);
            animation: pulse-glow 2.5s infinite alternate ease-in-out;
        }

        .logo-icon svg {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: white;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3); transform: scale(1) translateY(0); }
            100% { box-shadow: 0 20px 40px -5px rgba(59, 130, 246, 0.7); transform: scale(1.05) translateY(-2px); }
        }

        /* Typography */
        .logo-text {
            font-size: 34px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            background: linear-gradient(100deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        /* Bouncy Dots Loader */
        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-main);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; box-shadow: 0 0 12px var(--primary-light); }
        }

        /* Loading Text */
        .loading-text {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
        }

        /* Scanning Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            margin-top: 30px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
            border-radius: 4px;
            animation: scan 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes scan {
            0% { left: -40%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
        </div>
        
        <div class="logo-text">HDMS- Human Resource Data Management System</div>
        <div class="subtitle">System Initialization</div>
        
        <div class="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
        <div class="loading-text" id="loading-msg">Connecting to server...</div>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <script>
        const messages = [
            "Initializing environment...",
            "Connecting to server...",
            "Verifying database connections...",
            "Loading interface components...",
            "Preparing your workspace..."
        ];
        
        let msgIndex = 0;
        const msgElement = document.getElementById('loading-msg');
        
        // Cycle through loading messages to make the screen feel responsive
        setInterval(() => {
            msgIndex = (msgIndex + 1) % messages.length;
            msgElement.style.opacity = 0;
            
            setTimeout(() => {
                msgElement.innerText = messages[msgIndex];
                msgElement.style.opacity = 1;
            }, 300);
        }, 3000);
    </script>
</body>
</html>
