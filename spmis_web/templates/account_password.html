{% extends "base.html" %}{% block body %}
<h1>My Account &mdash; Change Password</h1>
<div class="panel" style="max-width:430px">
<p class="meta">{{ session.fullname or session.uname }} ({{ session.role }})</p>
<form method="post" class="grid" style="grid-template-columns:1fr">
  <label>Current password<input name="current" type="password" required></label>
  <label>New password<input name="new1" type="password" required></label>
  <label>Confirm new password<input name="new2" type="password" required></label>
  <button>Update password</button>
</form>
</div>
{% endblock %}
