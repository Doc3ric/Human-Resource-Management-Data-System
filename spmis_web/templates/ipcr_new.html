{% extends "base.html" %}{% block body %}
<h1>New IPCR</h1>
<form method="post" class="grid">
  <label>Employee<select name="emp_id" required>{% for e in employees %}<option value="{{e.id}}">{{e.last_name}}, {{e.first_name}} ({{e.role_type}})</option>{% endfor %}</select></label>
  <label>Rating Period<select name="period_id" required>{% for p in periods %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></label>
  <label>Intervening Task hours<input name="its_hours" type="number" step="0.1" value="0"></label>
  <button>Create</button>
</form>{% endblock %}
