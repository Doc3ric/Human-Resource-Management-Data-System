<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Error — HDMS- Human Resource Data Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 16px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.06);
            padding: 36px 32px 32px;
            max-width: 440px; width: 100%;
            display: flex; flex-direction: column; gap: 0;
        }

        /* ── Error icon ── */
        .icon-wrap {
            width: 64px; height: 64px;
            background: linear-gradient(135deg,#fee2e2,#fecdd3);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(239,68,68,.2);
        }
        .icon-wrap svg { width:30px; height:30px; stroke:#ef4444; }

        /* ── Header ── */
        .title { font-size:22px; font-weight:800; color:#0f172a; text-align:center; margin-bottom:6px; }
        .desc  { font-size:13.5px; color:#64748b; text-align:center; line-height:1.6; margin-bottom:28px; }

        /* ── Status banner (shown during retry) ── */
        .status-banner {
            display: none;
            align-items: center; gap: 10px;
            background: #eff6ff; border: 1px solid #bfdbfe;
            border-radius: 10px; padding: 12px 14px; margin-bottom: 20px;
            font-size: 13px; color: #1d4ed8; font-weight: 500;
        }
        .status-banner.visible { display: flex; }
        .spinner {
            width: 16px; height: 16px; flex-shrink: 0;
            border: 2.5px solid #bfdbfe; border-top-color: #2563eb;
            border-radius: 50%; animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Section divider ── */
        .section-label {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.2px; color: #94a3b8; margin-bottom: 10px;
        }

        /* ── Form ── */
        .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
        label { font-size:13px; font-weight:600; color:#0f172a; }
        input[type="text"] {
            width:100%; padding:11px 14px;
            border:1.5px solid #e2e8f0; border-radius:10px;
            font-size:14px; font-family:inherit; outline:none;
            background:#f8fafc; color:#0f172a;
            transition:border-color .2s, box-shadow .2s;
        }
        input[type="text"]:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15); background:#fff; }
        .hint { font-size:11.5px; color:#94a3b8; }

        /* ── Buttons ── */
        .btn {
            width:100%; padding:12px 16px; border-radius:10px;
            font-size:14px; font-weight:700; font-family:inherit;
            cursor:pointer; transition:all .2s;
            display:flex; align-items:center; justify-content:center; gap:8px;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg,#3b82f6,#2563eb);
            color:#fff;
            box-shadow:0 4px 14px rgba(37,99,235,.3);
        }
        .btn-primary:hover  { box-shadow:0 6px 20px rgba(37,99,235,.45); transform:translateY(-1px); }
        .btn-primary:active { transform:translateY(0); }

        .btn-success {
            background: linear-gradient(135deg,#10b981,#059669);
            color:#fff;
            box-shadow:0 4px 14px rgba(16,185,129,.3);
        }
        .btn-success:hover  { box-shadow:0 6px 20px rgba(16,185,129,.45); transform:translateY(-1px); }

        .btn-secondary {
            background:#f1f5f9; color:#475569;
            border:1.5px solid #e2e8f0;
        }
        .btn-secondary:hover { background:#e2e8f0; color:#0f172a; }

        .btn:disabled { opacity:.6; cursor:not-allowed; transform:none !important; }

        /* ── Button row ── */
        .btn-row { display:flex; gap:10px; margin-bottom:12px; }
        .btn-row .btn { flex:1; }

        /* ── Divider ── */
        .divider {
            border:none; border-top:1px solid #e5e7eb;
            margin: 20px 0;
        }

        /* ── Footer ── */
        .footer-label { font-size:12px; color:#94a3b8; text-align:center; margin-bottom:12px; }

        /* ── Success state ── */
        .card.success .icon-wrap { background:linear-gradient(135deg,#d1fae5,#a7f3d0); box-shadow:0 8px 24px rgba(16,185,129,.2); }
        .card.success .icon-wrap svg { stroke:#10b981; }
    </style>
</head>
<body>
    <div class="card" id="main-card">
        <!-- Error Icon -->
        <div class="icon-wrap">
            <svg id="card-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
            </svg>
        </div>

        <h1 class="title" id="card-title">Connection Failed</h1>
        <p class="desc"  id="card-desc">
            The app could not reach the HDMS- Human Resource Data Management System server.<br>
            Check that the server is running and try again.
        </p>

        <!-- Live status banner (shown during retry) -->
        <div class="status-banner" id="status-banner">
            <div class="spinner"></div>
            <span id="status-text">Connecting…</span>
        </div>

        <!-- ── Quick Retry ── -->
        <div class="btn-row">
            <button class="btn btn-success" id="retry-btn" onclick="retryNow()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M1 4v6h6M23 20v-6h-6"/>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                </svg>
                Try Again
            </button>
            <button class="btn btn-secondary" id="cancel-retry-btn" onclick="cancelRetry()" style="display:none;">
                Cancel
            </button>
        </div>

        <hr class="divider">

        <!-- ── Change Server URL ── -->
        <div class="section-label">Change Server Address</div>
        <form id="config-form">
            <div class="form-group">
                <label for="server-url">Host Server URL</label>
                <input type="text" id="server-url"
                    placeholder="http://10.40.2.59:8000"
                    required autocomplete="off" spellcheck="false">
                <span class="hint">Default: http://10.40.2.59:8000</span>
            </div>
            <button type="submit" class="btn btn-primary" id="save-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M5 13l4 4L19 7"/>
                </svg>
                Save &amp; Reconnect
            </button>
        </form>

        <hr class="divider">

        <!-- ── Advanced ── -->
        <div class="footer-label">Having persistent issues?</div>
        <button class="btn btn-secondary" id="clear-btn" onclick="clearAndRestart()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>
                <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
            </svg>
            Clear Cache &amp; Restart
        </button>
    </div>

    <script>
        // ── Init ─────────────────────────────────────────────────────────────
        const saved = localStorage.getItem('serverUrl') || 'http://10.40.2.59:8000';
        document.getElementById('server-url').value = saved;

        let retryTimer   = null;
        let retryRunning = false;

        // ── UI helpers ───────────────────────────────────────────────────────
        function setStatus(msg, visible = true) {
            const banner = document.getElementById('status-banner');
            const text   = document.getElementById('status-text');
            text.textContent = msg;
            banner.classList.toggle('visible', visible);
        }

        function setRetryUI(running) {
            retryRunning = running;
            const retryBtn  = document.getElementById('retry-btn');
            const cancelBtn = document.getElementById('cancel-retry-btn');
            const saveBtn   = document.getElementById('save-btn');
            const clearBtn  = document.getElementById('clear-btn');

            if (running) {
                retryBtn.disabled  = true;
                retryBtn.innerHTML = '<div class="spinner" style="border-color:rgba(255,255,255,.4);border-top-color:#fff;width:15px;height:15px;"></div> Connecting…';
                cancelBtn.style.display = '';
                saveBtn.disabled  = true;
                clearBtn.disabled = true;
            } else {
                retryBtn.disabled  = false;
                retryBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg> Try Again';
                cancelBtn.style.display = 'none';
                saveBtn.disabled  = false;
                clearBtn.disabled = false;
                setStatus('', false);
            }
        }

        function showSuccess() {
            document.getElementById('main-card').classList.add('success');
            document.getElementById('card-icon').innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>`;
            document.getElementById('card-title').textContent = 'Connected!';
            document.getElementById('card-desc').textContent  = 'Server found. Loading the application…';
        }

        // ── Try Again ────────────────────────────────────────────────────────
        async function retryNow() {
            if (retryRunning) return;
            setRetryUI(true);

            const url = localStorage.getItem('serverUrl') || 'http://10.40.2.59:8000';
            const MAX = 8;

            for (let i = 1; i <= MAX; i++) {
                setStatus(`Checking server… (${i}/${MAX})`);

                const alive = await pingServer(url);
                if (alive) {
                    showSuccess();
                    setStatus('Server ready! Redirecting…');
                    await sleep(900);
                    window.location.replace('index.html');
                    return;
                }

                if (i < MAX) {
                    setStatus(`Not responding. Retry in 3s… (${i}/${MAX})`);
                    await sleep(3000);
                }
            }

            setRetryUI(false);
            setStatus('Still unreachable. Please check the server URL below.', true);
        }

        function cancelRetry() {
            retryRunning = false; // next loop iteration will see this
            setRetryUI(false);
        }

        // ── Save & Reconnect ─────────────────────────────────────────────────
        document.getElementById('config-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.textContent = 'Connecting…';
            btn.disabled = true;

            let url = document.getElementById('server-url').value.trim();
            if (!url) return;
            if (!/^https?:\/\//i.test(url)) url = 'http://' + url;
            // Remove trailing slash
            url = url.replace(/\/$/, '');
            localStorage.setItem('serverUrl', url);

            setTimeout(() => { window.location.replace('index.html'); }, 300);
        });

        // ── Clear cache ──────────────────────────────────────────────────────
        function clearAndRestart() {
            const btn = document.getElementById('clear-btn');
            btn.textContent = 'Clearing…';
            btn.disabled = true;
            localStorage.clear();
            setTimeout(() => { window.location.replace('index.html'); }, 600);
        }

        // ── Shared helpers ───────────────────────────────────────────────────
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function pingServer(url) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 6000);
            try {
                await fetch(url + '/', {
                    signal: controller.signal,
                    cache:  'no-store',
                    mode:   'no-cors',
                });
                clearTimeout(timer);
                return true;
            } catch (_) {
                clearTimeout(timer);
                return false;
            }
        }
    </script>
</body>
</html>
