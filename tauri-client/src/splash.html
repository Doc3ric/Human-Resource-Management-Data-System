<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading HDMS- Human Resource Data Management System…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:      #2563eb;
            --primary-lt:   #3b82f6;
            --glow:         rgba(59,130,246,0.55);
            --bg-start:     #0f172a;
            --bg-end:       #1e293b;
            --text:         #f8fafc;
            --muted:        #94a3b8;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            -webkit-user-select: none; user-select: none;
            border-radius: 14px;
        }

        /* ── Ambient blobs ── */
        .blobs { position: absolute; inset: 0; overflow: hidden; border-radius: 14px; z-index: 0; }
        .blob  { position: absolute; filter: blur(90px); opacity: 0.28; border-radius: 50%;
                 animation: float 9s infinite ease-in-out alternate; }
        .blob-1 { width:360px; height:360px; background:var(--primary);   top:-110px; left:-110px; }
        .blob-2 { width:300px; height:300px; background:#7c3aed;           bottom:-80px; right:-80px; animation-delay:-4.5s; }
        @keyframes float { 0%{transform:translate(0,0)scale(1)} 100%{transform:translate(45px,40px)scale(1.1)} }

        /* ── Card ── */
        .card {
            position: relative; z-index: 1;
            text-align: center; padding: 3rem 4rem;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 24px;
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.55);
            animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
            opacity: 0; transform: translateY(22px);
            min-width: 340px;
        }
        @keyframes rise { to { opacity:1; transform:translateY(0); } }

        /* ── Logo icon ── */
        .logo-wrap { display:flex; justify-content:center; margin-bottom:22px; }
        .logo-icon {
            width:72px; height:72px;
            background: linear-gradient(135deg, var(--primary-lt), var(--primary));
            border-radius:20px;
            display:flex; align-items:center; justify-content:center;
            box-shadow: 0 10px 30px -5px var(--glow);
            animation: glow-pulse 2.5s infinite alternate ease-in-out;
        }
        .logo-icon svg { width:36px; height:36px; fill:none; stroke:#fff; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
        @keyframes glow-pulse {
            0%  { box-shadow:0 10px 25px -5px rgba(59,130,246,.3); transform:scale(1)     translateY(0); }
            100%{ box-shadow:0 20px 40px -5px rgba(59,130,246,.7); transform:scale(1.05) translateY(-2px); }
        }

        /* ── Typography ── */
        .title {
            font-size:30px; font-weight:800; letter-spacing:-.4px;
            background: linear-gradient(100deg,#fff,#cbd5e1);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            margin-bottom:5px;
        }
        .subtitle {
            font-size:11px; font-weight:600; letter-spacing:2.5px;
            text-transform:uppercase; color:var(--muted); margin-bottom:36px;
        }

        /* ── Bouncing dots ── */
        .dots { display:flex; justify-content:center; gap:8px; margin-bottom:14px; }
        .dot  { width:8px; height:8px; border-radius:50%; background:var(--text);
                animation:bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1){animation-delay:-.32s}
        .dot:nth-child(2){animation-delay:-.16s}
        @keyframes bounce{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1);opacity:1;box-shadow:0 0 10px var(--primary-lt)}}

        /* ── Status text ── */
        .status-text {
            font-size:13px; color:var(--muted); font-weight:400; letter-spacing:.4px;
            min-height:18px; transition:opacity .3s ease;
        }

        /* ── Progress bar ── */
        .progress-track {
            margin-top:28px; height:4px; border-radius:4px;
            background:rgba(255,255,255,0.06); overflow:hidden; position:relative;
        }
        /* The real-progress fill */
        .progress-fill {
            position:absolute; top:0; left:0; height:100%;
            background: linear-gradient(90deg,var(--primary),var(--primary-lt));
            border-radius:4px;
            width:0%; transition:width 0.6s ease;
        }
        /* Shimmer scan overlay */
        .progress-scan {
            position:absolute; top:0; left:-40%; height:100%; width:40%;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
            animation:scan 2s infinite cubic-bezier(.4,0,.2,1);
        }
        @keyframes scan{0%{left:-40%}100%{left:100%}}

        /* ── Attempt badge ── */
        .attempt-badge {
            display:inline-block; margin-top:14px;
            font-size:10px; font-weight:600; letter-spacing:1px;
            color:rgba(148,163,184,.6);
        }
    </style>
</head>
<body>
    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="card">
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
        </div>

        <div class="title">HDMS- Human Resource Data Management System</div>
        <div class="subtitle">PHRMO Portal</div>

        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="status-text" id="status-msg">Initializing…</div>

        <div class="progress-track">
            <div class="progress-fill"  id="progress-fill"></div>
            <div class="progress-scan"></div>
        </div>

        <div class="attempt-badge" id="attempt-badge"></div>
    </div>

    <script>
        const msgEl     = document.getElementById('status-msg');
        const fillEl    = document.getElementById('progress-fill');
        const badgeEl   = document.getElementById('attempt-badge');

        /** Smooth-update the status text with a fade transition */
        function setStatus(message, attempt, max) {
            msgEl.style.opacity = '0';
            setTimeout(() => {
                msgEl.textContent   = message;
                msgEl.style.opacity = '1';
            }, 200);

            // Update progress bar
            if (max > 0) {
                const pct = Math.min(100, (attempt / max) * 100);
                fillEl.style.width = pct + '%';
            }

            // Attempt counter badge
            if (attempt > 0 && max > 0) {
                badgeEl.textContent = `Attempt ${attempt} of ${max}`;
            } else {
                badgeEl.textContent = '';
            }
        }

        // ── Listen for status events from main.js ─────────────────────────────
        (async () => {
            try {
                const unlisten = await window.__TAURI__.event.listen('splash:status', (event) => {
                    const { message, attempt, max } = event.payload;
                    setStatus(message, attempt, max);
                });

                // Auto-clean listener after 3 minutes (safety net)
                setTimeout(unlisten, 3 * 60 * 1000);
            } catch (err) {
                // If Tauri events aren't available, fall back to cycling messages
                const fallbackMsgs = [
                    'Initializing environment…',
                    'Connecting to server…',
                    'Verifying database connection…',
                    'Loading interface components…',
                    'Preparing your workspace…',
                ];
                let i = 0;
                setInterval(() => {
                    i = (i + 1) % fallbackMsgs.length;
                    setStatus(fallbackMsgs[i], 0, 0);
                }, 3000);
            }
        })();
    </script>
</body>
</html>
